name: CI Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.12'
  DJANGO_SETTINGS_MODULE: core.settings
  SECRET_KEY: ci-only-non-production-secret-key-1234567890-abcdefghij-klmnopqrst-50chars
  DEBUG: "False"
  ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

jobs:
  frontend-lint-typecheck:
    name: Frontend Lint & TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    needs: [frontend-lint-typecheck, frontend-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1

  backend-lint-tests:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: primekey
          POSTGRES_USER: primekey
          POSTGRES_PASSWORD: primekey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primekey -d primekey"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://primekey:primekey@localhost:5432/primekey
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1
      DJANGO_Q_REDIS_URL: redis://localhost:6379/2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure database tables exist
        run: python manage.py migrate --run-syncdb --noinput

      - name: Run Django system checks
        run: python manage.py check --verbosity=3

      - name: Run Django migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run backend tests
        run: python -m pytest -q

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: primekey
          POSTGRES_USER: primekey
          POSTGRES_PASSWORD: primekey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primekey -d primekey"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://primekey:primekey@localhost:5432/primekey
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1
      DJANGO_Q_REDIS_URL: redis://localhost:6379/2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure database tables exist
        run: python manage.py migrate --run-syncdb --noinput

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run security regression tests
        run: python -m pytest apps/security/tests.py -v --tb=short

      - name: Run bandit SAST scan
        run: bandit -r apps/ core/ -c .bandit -f json -o bandit.json || true

      - name: Run pip-audit dependency scan
        run: pip-audit --desc --output pip-audit.json --format json || true

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            backend/bandit.json
            backend/pip-audit.json

  backend-migrations:
    name: Backend Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    needs: backend-lint-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: primekey
          POSTGRES_USER: primekey
          POSTGRES_PASSWORD: primekey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primekey -d primekey"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://primekey:primekey@localhost:5432/primekey
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1
      DJANGO_Q_REDIS_URL: redis://localhost:6379/2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations against clean database
        run: python manage.py migrate --noinput

  e2e-tests:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-migrations]
    defaults:
      run:
        working-directory: ./frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: primekey
          POSTGRES_USER: primekey
          POSTGRES_PASSWORD: primekey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primekey -d primekey"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start backend server
        run: |
          cd ../backend
          export DATABASE_URL=postgresql://primekey:primekey@localhost:5432/primekey
          export REDIS_URL=redis://localhost:6379/0
          export REDIS_CACHE_URL=redis://localhost:6379/1
          export DJANGO_Q_REDIS_URL=redis://localhost:6379/2
          python manage.py migrate --noinput
          python manage.py runserver 0.0.0.0:8000 &
          sleep 5

      - name: Start frontend server
        run: |
          npm run dev &
          sleep 10

      - name: Run Cypress E2E tests
        run: npm run cypress:run
        env:
          CYPRESS_BASE_URL: http://localhost:3000

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_APP_DIR }}
            git pull --ff-only origin develop
            docker compose build
            docker compose up -d
            docker image prune -f

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_APP_DIR }}
            git pull --ff-only origin master
            docker compose build
            docker compose up -d
            docker image prune -f
