services:
  - type: web
    name: primekey-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: primekey-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://primekey.vercel.app
      - key: CORS_ALLOW_CREDENTIALS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: primekey-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: primekey-redis
          type: redis
          property: connectionString
      - key: REDIS_CACHE_URL
        fromService:
          name: primekey-redis
          type: redis
          property: connectionString
      - key: DJANGO_Q_REDIS_URL
        fromService:
          name: primekey-redis
          type: redis
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: SENDCHAMP_API_KEY
        sync: false
      - key: SENDCHAMP_SENDER_ID
        value: Primekey
      - key: SENDCHAMP_ROUTE
        value: dnd

  - type: worker
    name: primekey-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python manage.py qcluster
    plan: starter
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromService:
          name: primekey-api
          type: web
          property: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: primekey-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: primekey-redis
          type: redis
          property: connectionString
      - key: REDIS_CACHE_URL
        fromService:
          name: primekey-redis
          type: redis
          property: connectionString
      - key: DJANGO_Q_REDIS_URL
        fromService:
          name: primekey-redis
          type: redis
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: SENDCHAMP_API_KEY
        sync: false
      - key: SENDCHAMP_SENDER_ID
        value: Primekey
      - key: SENDCHAMP_ROUTE
        value: dnd

databases:
  - name: primekey-db
    plan: starter
    databaseName: primekey
    user: primekey
    ipAllowList: []

  - name: primekey-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
