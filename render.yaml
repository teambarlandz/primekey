# Render Blueprint - Primekey Homes production topology
#
#   Frontend  Vercel   Next.js, built with NEXT_PUBLIC_API_URL pointing here.
#   Backend   Render   this file: Django web service + django-q worker.
#
# The backend deploys first; Vercel then bakes the API URL into its own build.
#
# Runtime choices (https://render.com/docs/deploy-django):
#   * runtime: python is Render's standard Django runtime. The Docker runtime is
#     only for system dependencies pip cannot install, and this service has none:
#     psycopg2-binary bundles its own libpq.
#   * Static files are served from STATIC_ROOT by WhiteNoise, which is already in
#     MIDDLEWARE. Render's edge terminates TLS and proxies to $PORT, so no nginx
#     process runs on the service.
#   * rootDir: backend because manage.py, requirements.txt and core/ live there.
#   * The Python version is pinned with PYTHON_VERSION, not a `pythonVersion`
#     blueprint key: that key is not in the blueprint spec, so it was silently
#     ignored and the service would have run Render's default (currently 3.14.3)
#     while CI verifies 3.13. PYTHON_VERSION must be fully qualified.
#   * Migrations run in the build command, NOT preDeployCommand: Render
#     documents the pre-deploy command as paid-only
#     (https://render.com/docs/deploys#pre-deploy-command), so on the free plan
#     it is silently ignored and the schema would never advance. Move it back to
#     preDeployCommand when the web service goes paid, so migrations stop racing
#     the still-serving old instance.
#   * buildCommand and collectstatic both import settings, so the
#     RESEND_API_KEY guard in core/config_checks.py fails the build loudly rather
#     than booting a service that cannot deliver OTPs.
#
# Render Key Value (primekey-redis) is declared under `services` with
# `type: keyvalue`, not under `databases`, which is Postgres-only. `redis` is a
# deprecated alias and `fromService.type` must be spelled `keyvalue`.

services:
  - type: web
    name: primekey-api
    runtime: python
    rootDir: backend
    region: oregon
    # Paid "Individual" tier: 0.5 CPU / 512 MB ($7/mo per render.com/pricing).
    # The old `starter` plan id no longer exists in Render's blueprint schema.
    #
    # This is the cheapest paid plan and it unlocks three things the free tier
    # refused: a persistent disk, the pre-deploy command, and a configurable
    # shutdown delay. See PRODUCTION_READY.md 7.9.
    plan: 0.5c-512mb
    # A disk cannot be shared between services and cannot be mounted on a
    # multi-instance service, so this stays pinned to a single instance.
    numInstances: 1
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    # Migrations live here, NOT in buildCommand, and NOT on the free tier where
    # pre-deploy commands are unavailable. This is the correct home for them:
    # it runs once per release, after the build succeeds and before the new
    # instance serves traffic, so it never races the still-running old one.
    # The pre-deploy instance cannot see the disk, which is fine - migrate only
    # touches Postgres.
    preDeployCommand: python manage.py migrate --noinput
    # 2 workers fits the plan's 512 MB. Raise with the plan's RAM.
    # max-requests recycles workers so a slow leak cannot grow unbounded.
    # --graceful-timeout is 20s because the disk below blocks
    # maxShutdownDelaySeconds, so Render's fixed 30s shutdown delay applies.
    # gunicorn must finish draining before Render SIGKILLs at 30s.
    startCommand: >-
      gunicorn core.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 25
      --graceful-timeout 20
      --max-requests 1200
      --max-requests-jitter 100
      --access-logfile -
      --error-logfile -
    healthCheckPath: /api/health/
    # NOT set alongside the disk below: Render rejects
    # "max shutdown delay is not supported for services with a disk". See the
    # disk block for why the disk is the more important of the two.
    autoDeployTrigger: commit
    # Uploads must survive redeploys. Without this disk every deploy deletes
    # landlord documents, agent resumes and photos. Sized at Render's minimum
    # of 10 GB, which is $2.50/mo at $0.25/GB.
    #
    # Two costs of keeping it, both accepted for production:
    #   1. Zero-downtime deploys are disabled - Render stops the old instance
    #      before starting the new one, so each deploy has a few seconds of
    #      downtime. The alternative is losing user data on every deploy.
    #   2. numInstances must stay 1; a disk cannot be mounted on several
    #      instances at once.
    #   3. The disk is not visible during buildCommand or preDeployCommand,
    #      which run on separate compute. Neither needs it.
    disk:
      name: primekey-data
      mountPath: /var/data
      sizeGB: 10
    # MEDIA_ROOT points at the mount path so uploads land on the disk rather
    # than the ephemeral container filesystem.
    #
    # PROTECTED_STORAGE_DIR (resumes, compliance documents) defaults alongside
    # MEDIA_ROOT in settings.py, so it inherits the same persistence.
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: primekey-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://primekey.vercel.app
      # The API is JWT-only, so this only matters for admin and HTML form
      # flows. settings.py derives CSRF_TRUSTED_ORIGINS from
      # CORS_ALLOWED_ORIGINS so there is only one origin list to maintain.
      - key: CORS_ALLOW_CREDENTIALS
        value: "True"
      - key: SPECTACULAR_RESTRICT_DOCS
        value: "True"
      # Render sets X-Forwarded-Proto: https and SECURE_PROXY_SSL_HEADER trusts
      # it, so this redirects plain HTTP without looping behind the proxy.
      - key: SECURE_SSL_REDIRECT
        value: "True"
      # Point both storage roots at the persistent disk mounted above.
      # Without these, settings.py falls back to BASE_DIR/media, which lives on
      # the ephemeral container filesystem and is wiped on every deploy.
      # PROTECTED_STORAGE_DIR is outside MEDIA_ROOT on purpose: agent resumes
      # and compliance documents are served only through the authenticated
      # download endpoint, never by a public static file handler.
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: PROTECTED_STORAGE_DIR
        value: /var/data/protected
      - key: DATABASE_URL
        fromDatabase:
          name: primekey-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: primekey-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_CACHE_URL
        fromService:
          name: primekey-redis
          type: keyvalue
          property: connectionString
      - key: DJANGO_Q_REDIS_URL
        fromService:
          name: primekey-redis
          type: keyvalue
          property: connectionString
      # OTP delivery. The from address must match the verified Resend domain,
      # and DEFAULT_FROM_EMAIL is also the Resend sender in otp_auth/services.py.
      - key: RESEND_API_KEY
        sync: false
      # Contact form / concierge leads. The dev default is the console backend,
      # which silently discards mail in production.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.hostinger.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USE_SSL
        value: "True"
      - key: EMAIL_USE_TLS
        value: "False"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Primekey Homes <hello@primekeyhomesandpropertiesltd.com>
      - key: CONTACT_RECIPIENT_EMAIL
        value: hello@primekeyhomesandpropertiesltd.com
      # Both live under the mounted disk so they survive redeploys. NDPR exports
      # are not here: they are stored on ExportRequest.export_payload in Postgres
      # because the worker writes them and the web service reads them, and a
      # Render disk cannot be mounted on two services.
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: PROTECTED_STORAGE_DIR
        value: /var/data/protected
      # MEDIA_ROOT is served by Django (urls.py serves it explicitly because
      # django.conf.urls.static.static() is a no-op when DEBUG=False). Set False
      # once media moves to S3 or a CDN.
      - key: SERVE_MEDIA
        value: "True"
      # Set to False only to boot before the provider key exists. OTPs then
      # return 503 until the key is added, so do not leave it off.
      - key: REQUIRE_OTP_PROVIDERS
        value: "True"

  - type: worker
    name: primekey-worker
    runtime: python
    rootDir: backend
    region: oregon
    # Workers have no free plan, so this cannot be `free`.
    plan: 0.5c-512mb
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements.txt
    startCommand: python manage.py qcluster
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "False"
      # The worker boots Django settings too, so it must pass the same
      # production guard as the web service (ALLOWED_HOSTS is not optional).
      #
      # sync: false, not fromService. Render rejects
      # `fromService.property: SECRET_KEY` ("cannot refer to SECRET_KEY against
      # service primekey-api of type web") because a `generateValue: true` secret
      # is not an exportable property. Paste the SAME value used on primekey-api
      # in the dashboard: the two services share signed cookies and session
      # state, and a mismatch shows up as intermittent auth failures.
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: primekey-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://primekey.vercel.app
      - key: CORS_ALLOW_CREDENTIALS
        value: "True"
      - key: SPECTACULAR_RESTRICT_DOCS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: primekey-db
          property: connectionString
      # Render's Key Value connectionString is `redis://red-xxx:6379` with NO
      # database index, so pointing all three at it directly puts the cache, the
      # session/axes data and the django-q broker on db 0. The cache's
      # allkeys-lru eviction can then delete queued jobs and the broker's keys
      # can be evicted from under the worker. settings.py appends the indices
      # below, so only the base URL is passed here.
      - key: REDIS_URL
        fromService:
          name: primekey-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_CACHE_URL
        fromService:
          name: primekey-redis
          type: keyvalue
          property: connectionString
      - key: DJANGO_Q_REDIS_URL
        fromService:
          name: primekey-redis
          type: keyvalue
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      # No disk and no storage env vars on the worker. The only file it used to
      # write was the NDPR export, which now lives in Postgres, and a Render disk
      # cannot be mounted on two services in any case.

  # Render Key Value lives under `services`, not `databases`, which is
  # Postgres-only. ipAllowList is a required field; [] means internal-only.
  - type: keyvalue
    name: primekey-redis
    region: oregon
    # 256 MB / 200 connections ($10/mo per render.com/pricing). The free plan is
    # 25 MB, in-memory only, and Render wipes its data on every restart - which
    # would silently drop the django-q broker and every rate-limit counter.
    plan: 256mb
    ipAllowList: []
    # noeviction, not allkeys-lru: this instance is also the django-q job
    # broker, and an LRU policy can evict queued jobs when memory fills. Failing
    # the write is visible; losing a compliance export is not. settings.py
    # still separates the cache (db 1) from the broker (db 2) so cache churn
    # cannot touch queued jobs.
    maxmemoryPolicy: noeviction

databases:
  - name: primekey-db
    region: oregon
    plan: 0.5c-1g
    # Cannot be changed after creation. Pinned to match the postgres:16-alpine
    # image CI verifies migrations against; the platform default is now 18.
    postgresMajorVersion: "16"
    databaseName: primekey
    user: primekey
    # Private network only. scripts/backup.sh must therefore run from the Render
    # Shell or a one-off job, not from a laptop.
    ipAllowList: []
